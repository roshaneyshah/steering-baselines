[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "steering-baselines"
version = "0.1.0"
description = "Weather-example reproduction and steering baselines for Learning When to Intervene"
requires-python = ">=3.10"
dependencies = ["strands-agents[openai,ollama,anthropic]>=1.63"]

[project.optional-dependencies]
test = ["pytest>=8", "fastapi>=0.115", "uvicorn>=0.30", "pydantic>=2.7"]

[tool.setuptools.packages.find]
where = ["src"]
